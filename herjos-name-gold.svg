<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap');
      .gold-text {
        font-family: 'Alex Brush', cursive;
        font-size: 110px;
        fill: url(#gold-gradient);
        filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.4));
      }
    </style>

    <!-- Gradiente dorado metálico -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE074" />
      <stop offset="35%" stop-color="#EAA123" />
      <stop offset="70%" stop-color="#B26B09" />
      <stop offset="100%" stop-color="#FCDA68" />
    </linearGradient>
  </defs>

  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" class="gold-text">HerJos</text>
</svg>
